    Yulia is a cognitive neuroscientist with interests in everything 
    related to speech and language.
    Prior to starting the lab in Tübingen, she worked as a postdoc at  
    the University of California, San Francisco and got her PhD at the 
    Freie Universitat and the Bernstein Center for Computational 
    Neuroscience (BCCN) in Berlin.
    Outside science Yulia studies trilingual language acquisition with 
    her two sons and waits for them to walk well enough to explore the hiking 
    trails around Tuebingen.
    Yulia speaks Russian, German, Hebrew, and English in her day to day. 
    She sometimes tries to speak Spanish and French, but mostly with little success.
