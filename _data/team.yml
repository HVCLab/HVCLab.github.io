- name: Peter Bang
  is_pi: False
  is_current: True
  position: Postdoctoral Researcher
  linkedin: https://www.linkedin.com/in/peterbangpsych/
  twitter: https://twitter.com/peterbang1992?lang=en
  bio: >
    Peter, a psychologist turned neuroscientist, is passionate about exploring the intersection 
    of brain and behavior. He earned his PhD from Linköping University, where he focused on the 
    role of sensorimotor processing in quantitative autistic traits, with particular emphasis on 
    social pragmatic communication.
    At the Human Verbal Communication Lab, Peter investigates the impact of social 
    pragmatic communication problems on the neural encoding of prosodic features in natural conversation. 
    He employs behavioral paradigms and MEG in his research. Peter's overarching goal in science is to 
    enhance the understanding of individual differences through measures of physiology and behavior, 
    while ensuring that his research remains meaningful to those it concerns.
    Outside of work, Peter enjoys cooking, brewing beer, and discussing football. He is fluent in Danish, 
    Swedish, and English, and hopes to add German to his repertoire.
  photo: /images/team/peter_bang.jpg


- name: Lena Henke
  is_pi: False
  is_current: True
  position: Postdoctoral Researcher
  researchgate: https://www.researchgate.net/profile/Lena-Henke-2
  bio: >
    Lena is a postdoctoral researcher between the HVC lab and the Dynamic Cognition Group at the MPI for Biological Cybernetics. 
    After completing a B.Sc. in Cognitive Science and a M.Sc. in Clinical Linguistics, she did her PhD at the MPI for Human 
    Cognitive and Brain Sciences in Leipzig. Her prior research has focussed on the role of low-frequency cortical activity as 
    temporal constraint on language processing. Generally, she is interested in how neural mechanisms influence the perception 
    of the world around us. In the labs, she now aims at investigating how temporal structure and predictive timing support 
    (natural) speech processing. In her free time, Lena enjoys doing sports and is particularly excited to discover
     the surroundings of Tübingen by bike. Lena speaks German, English and French.
  photo: /images/team/lena_henke.png


- name: Charlotte Mock
  is_pi: False
  is_current: True
  position: PhD Student
  github: https://github.com/charlottemock
  linkedin: https://www.linkedin.com/in/charlotte-m-mock/ 
  bluesky: https://bsky.app/profile/charlottemock.bsky.social
  bio: >
    Charlotte is a speech and language therapist turned cognitive scientist with
    an interest in the neural underpinnings of multimodal language processing. 
    After receiving her B.A. from the Ludwig-Maximilians University in Munich, 
    Charlotte moved to Kaiserslautern and completed her M.Sc. in Cognitive Science 
    at the Technical University. In February 2022, she joined the HVC lab as a 
    PhD student. Charlotte is currently interested in temporal landmarks in the 
    speech signal and plans on using electrophysiological as well as behavioral 
    data in the future.
    In her free time, she enjoys making lino prints and trying out new recipes. 
    Charlotte speaks German and English, and is currently brushing up on her French.
  photo: /images/team/charlotte_mock.jpg

- name: Mara Wolter
  is_pi: False
  is_current: True
  position: PhD Student
  researchgate: https://www.researchgate.net/profile/Mara-Wolter-2 
  scholar: https://scholar.google.com/citations?user=DIuROyYAAAAJ&hl=de 
  github: https://github.com/marakw
  linkedin: https://www.linkedin.com/in/marawolter/
  bio: >
    Mara is a natural scientist with a focus on auditory neuroscience and electrophysiological 
    signal processing. She started as a PhD candidate in the lab in February 2022. Mara completed 
    her Bachelors in biological sciences at Goethe University Frankfurt, where she did research 
    on the auditory system of bats. For her Masters, she specialized in interdisciplinary 
    neuroscience at the same university. Her main interest lies in how the human auditory 
    system integrates information over time, in particular how humans adjust to different 
    speech rates. Outside of the lab, she enjoys jogging and singing/songwriting with her guitar. 
    Mara speaks German, Luxembourgish, English and French, she also tries to wrap her head around 
    Greek (amazing how every Greek sentence feels like a math formula!).
  photo: /images/team/mara_wolter.jpeg

- name: Andrey Zyryanov
  is_pi: False
  is_current: True
  position: PhD Student
  scholar: https://scholar.google.com/citations?user=YfDnr0AAAAAJ&hl=en 
  bio: >
    Andrey received a B.A. degree in Linguistics and an M.A. degree in Cognitive Neuroscience at 
    the HSE University, Moscow, Russia. He has been using neuroimaging and stimulation methods in 
    clinical populations to study the neuroanatomical substrates of language processing. In 2022, 
    Andrey joined the HVC lab as a student of the 5-year M.Sc./Ph.D. program at the International 
    Max Planck Research School: The Mechanisms of Mental Function and Dysfunction. His research aims 
    to better understand the mechanisms that enable the mapping between the phonological and the 
    lexical-semantic representations of words. In his free time, Andrey likes doing sports, with his 
    favorite one being skiing. He speaks Russian and English.
  photo: /images/team/andrey_zyryanov.jpg


- name: Luzie Kallfaß
  is_pi: False
  is_current: True
  position: PhD Student
  linkedin: https://www.linkedin.com/in/luzie-kallfa%C3%9F-31b51634b/
  bio: >
    Luzie is a Biologist, who focused on Neurobiology in her Masters. In April 2024 she started as a PhD 
    candidate in the lab. In her Bachelors Luzie studied Biology at the University of Tübingen and 
    as she realized that the brain and all its mysteries fascinated her the most regarding the big topic of Biology, 
    she decided to continue with the Neurobiology Master in Tübingen. After she completed her Masters, 
    she did an ERASMUS+ internship at the University of Gent, where she worked on an EEG project about conformity. 
    In the lab, she is now investigating the different states of neutrality in the brain during a perceptual decision-making task. 
    Outside of the lab Luzie enjoys doing sports and yoga and reading all kind of books. 
    Luzie speaks German and English, and knows some basics in French and Kiswahili.
  photo: /images/team/luzie_kallfass.jpg


- name: Chang Liu
  is_pi: False
  is_current: True
  position: PhD Student
  bio: >
    Chang completed a B.A. in General Linguistics and an M.Sc. in Cognitive Science at the University of Tübingen. 
    He is passionate about the commonalities and differences between languages, the intricate structures of speech,
    and technologies that enable the discovery of patterns in language and cognition. Viewing linguistic data as the 
    tip of deeper cognitive processes, he aims to bridge linguistics and neuroscience to gain insights into language processing. 
    He is currently part of the collaborative research center "Robust Vision", where he compares visual and auditory processing 
    in artificial neural networks and in the human brain. Outside of the lab, he enjoys cooking and making pickles. 
    Chang speaks Chinese, English, and German, and possesses a reading knowledge of Japanese.
  photo: /images/team/chang_liu.jpg


- name: Lea-Marie Tewald
  is_pi: False
  is_current: True
  position: Medical Student
  github: https://github.com/lmctewald
  bio: >
    Lea-Marie is studying medicine at the University of Tübingen with a special interest in neurology and psychosomatics. 
    Her curiosity for bilingual language processing and the background of language-associated diseases motivated her to
    join the hvc lab as a medical student in October 2022. Her research aims to better understand cross-linguistic effects on 
    neural language processing, especially with regard to syllable rhythm. Beyond her research, Lea-Marie is also passionate about 
    foreign languages paving the way to explore and learn about different cultures. In her free time, Lea-Marie enjoys exploring new 
    jogging tracks across Tübingen and playing the flute in different orchestras. In addition to her native German, she speaks English, 
    French, some Italian and is always happy to find new conversation partners to improve her knowledge of Thai. 
  photo: /images/team/lea-marie_tewald.jpeg


- name: Joel Baisch
  is_pi: False
  is_current: True
  position: Research Assistant
  bio: >
    Joel is a Master's student in Cognitive Science at the University of Tübingen. He completed his Bachelor's degree in General Linguistics and English, 
    where he developed a strong interest in language contact, perception of language varieties, and historical linguistics. 
    His fascination with these topics was sparked during extended stays in Norway, spanning over two years, where he immersed himself in learning Norwegian. 
    He further deepened his interest in regional varieties through his Bachelor's thesis on the Swabian dialect. 
    Outside of academia, Joel is passionate about making music and enjoys staying active through sports.
  photo: /images/team/joel_baisch.jpg


- name: Victoria Pierz
  is_pi: False
  is_current: True
  position: Master Student
  bio: >
    Victoria is a masters student of Cognitive Science at the University of Tübingen 
    who did her bachelors in computational linguistics. Her interest in languages started 
    at a young age as she grew up bilingual and continued learning languages as a hobby. 
    While her studies deepened her interest in speech processing and natural language 
    understanding, Victoria's passion for understanding the human brain led her to join 
    the HVC lab as a research assistant. 
    Here, she applies her knowledge in computational linguistics to explore the connections 
    between language and cognition. Because of this experience she decided to do her masters 
    in cognitive science to dive deeper into cognitive research. Outside of her academic 
    commitments she loves to bake, knit and play the guitar or piano.
  photo: /images/team/victoria_pierz.jpg

